[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "poly_jump_signature"
version = "0.1.0"
description = "Expected signature of polynomial jump-diffusions, in closed form via generator matrix exponentiation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Christa Cuchiero"},
  {name = "Francesca Primavera"},
  {name = "Sara Svaluto-Ferro"},
]
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
]

[project.optional-dependencies]
notebooks = ["jupyter>=1.0", "iisignature>=0.24", "matplotlib>=3.7", "ipython-autotime>=0.3"]
dev = ["pytest>=7.4"]

[project.urls]
Repository = "https://github.com/fprimavera/expected_signature_polyjumpdiffusions"

[tool.setuptools]
packages = ["poly_jump_signature"]
